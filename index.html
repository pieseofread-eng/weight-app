<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="重量集計">
<title>重量シール集計</title>
<style>
  :root { --main:#2e7d5b; --bg:#f4f6f5; --line:#d5dbd8; --warn:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans",sans-serif; background:var(--bg); color:#222; font-size:17px; padding-bottom:80px; }
  header { background:var(--main); color:#fff; padding:14px 16px; font-size:20px; font-weight:bold; position:sticky; top:0; z-index:5; }
  nav { display:flex; position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); z-index:5; padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; padding:14px 0; border:none; background:none; font-size:16px; color:#666; }
  nav button.on { color:var(--main); font-weight:bold; }
  section { display:none; padding:14px; }
  section.on { display:block; }
  .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  label { display:block; font-size:14px; color:#555; margin:8px 0 4px; }
  select, input { width:100%; font-size:17px; padding:10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  button.big { width:100%; padding:14px; font-size:18px; border:none; border-radius:10px; background:var(--main); color:#fff; margin-top:10px; }
  button.sub { width:100%; padding:12px; font-size:16px; border:1px solid var(--main); border-radius:10px; background:#fff; color:var(--main); margin-top:10px; }
  button.small { padding:6px 10px; font-size:14px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .seal { display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
  .seal input[type=checkbox] { width:26px; height:26px; flex:none; }
  .seal .dt { flex:1.4; } .seal .wt { flex:1; }
  .seal input.dt, .seal input.wt { padding:6px; font-size:15px; }
  .done { opacity:.45; }
  .tag { font-size:12px; color:var(--warn); }
  .total { font-size:22px; font-weight:bold; color:var(--main); text-align:center; margin:10px 0; }
  .muted { color:#777; font-size:14px; }
  .hist { padding:10px 0; border-bottom:1px solid var(--line); }
  #status { font-size:15px; color:#555; margin-top:8px; white-space:pre-line; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  td,th { border-bottom:1px solid var(--line); padding:6px 4px; text-align:left; }
</style>
</head>
<body>
<header>重量シール集計 <span style="font-size:12px;font-weight:normal">版6（11/20）</span></header>

<!-- 回収 -->
<section id="tab-collect" class="on">
  <div class="card">
    <label>店舗</label>
    <select id="store"></select>
    <label>回収日（撮影日）</label>
    <input type="date" id="cdate">
  </div>
  <div class="card">
    <div class="muted">写真アプリで台紙の写真を開き、文字を長押し →「すべてを選択」→「コピー」してから、下のボタンを押してください。台紙が何枚あっても、1枚ずつ繰り返せば足されていきます。</div>
    <button class="big" onclick="pasteText()">📋 コピーした文字を貼り付けて読み取る</button>
    <textarea id="paste" rows="4" style="width:100%;margin-top:8px;font-size:15px" placeholder="読み取った文字がここに出ます。うまく貼り付かないときは、ここを長押しして「ペースト」→ 下のボタン"></textarea>
    <button class="sub" onclick="readText($('paste').value)">↑ この文字を読み取る</button>
    <div id="status"></div>
    <button class="sub" onclick="addManual()">＋ 手で1枚追加する</button>
  </div>
  <div class="card">
    <div class="muted">チェックの付いたシールだけを今回の分として数えます。<br>灰色＝前回までに数えたシール（自動でチェックなし）。</div>
    <div id="seals"></div>
    <div class="total" id="sum">0枚　0.00kg</div>
    <button class="big" onclick="saveCollection()">この内容で記録する</button>
    <button class="sub" onclick="clearWork()">やり直す（入力を消す）</button>
  </div>
</section>

<!-- 記録 -->
<section id="tab-history">
  <div class="card">
    <label>店舗で絞る</label>
    <select id="hstore" onchange="renderHistory()"></select>
    <label>月</label>
    <input type="month" id="hmonth" onchange="renderHistory()">
    <div class="total" id="hsum"></div>
  </div>
  <div id="hlist"></div>
</section>

<!-- 設定 -->
<section id="tab-settings">
  <div class="card">
    <b>店舗の登録</b>
    <div id="storelist"></div>
    <label>新しい店舗名</label>
    <input id="newstore" placeholder="例：くびき店">
    <button class="sub" onclick="addStore()">店舗を追加</button>
  </div>
  <div class="card">
    <b>データの控え</b>
    <div class="muted">記録はこのiPhoneの中だけに保存されます。機種変更に備えて、ときどき控えを保存してください。</div>
    <button class="sub" onclick="exportData()">控えを保存する</button>
    <button class="sub" onclick="document.getElementById('imp').click()">控えから戻す</button>
    <input type="file" id="imp" accept=".json" hidden>
  </div>
</section>

<nav>
  <button class="on" data-t="collect">回収</button>
  <button data-t="history">記録</button>
  <button data-t="settings">設定</button>
</nav>

<script>
// ===== 保存（このiPhoneの中だけ） =====
const KEY = 'weightSealApp_v1';
let db = JSON.parse(localStorage.getItem(KEY) || '{"stores":[],"collections":[]}');
function persist(){ localStorage.setItem(KEY, JSON.stringify(db)); }

let work = []; // 今回の候補 {dt:'2026-11-07T16:18', kg:11.46, on:true}

const $ = id => document.getElementById(id);
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };

// ===== タブ =====
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('section').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); $('tab-'+b.dataset.t).classList.add('on');
  if (b.dataset.t==='history') renderHistory();
});

// ===== 店舗 =====
function renderStores(){
  const opts = db.stores.map(s=>`<option>${esc(s)}</option>`).join('');
  $('store').innerHTML = opts || '<option value="">（設定で店舗を登録してください）</option>';
  $('hstore').innerHTML = '<option value="">すべて</option>' + opts;
  $('storelist').innerHTML = db.stores.map((s,i)=>
    `<div class="seal"><span style="flex:1">${esc(s)}</span><button class="small" onclick="delStore(${i})">消す</button></div>`).join('');
}
function addStore(){ const v=$('newstore').value.trim(); if(!v) return; if(!db.stores.includes(v)) db.stores.push(v); $('newstore').value=''; persist(); renderStores(); }
function delStore(i){ if(confirm(db.stores[i]+' をリストから消しますか？（記録は残ります）')){ db.stores.splice(i,1); persist(); renderStores(); } }
$('store').onchange = () => { markDone(); renderWork(); };

// ===== 既に数えたシールかどうか =====
// 台紙のシールは重さで見分ける。日時が両方とも読めているときは日時も合わせる
// 同じ重さが2枚あれば、前回の記録にも2枚あるときだけ両方を「数えた」とする
const same=(a,b)=>Number(a).toFixed(2)===Number(b).toFixed(2);
function markDone(){
  const store=$('store').value, from=new Date(($('cdate').value||today())+'T00:00');
  from.setDate(from.getDate()-60); const fromS=from.toISOString().slice(0,10);
  const pool=[]; db.collections.filter(c=>c.store===store&&c.date>=fromS).forEach(c=>c.seals.forEach(x=>pool.push({...x})));
  work.forEach(w=>{ if(w.done) w.on=true; w.done=false; });
  [w=>p=>w.dt&&p.dt===w.dt, w=>p=>!w.dt||!p.dt].forEach(rule=>work.forEach(w=>{
    if(w.done||!w.kg) return;
    const p=pool.find(p=>!p.used&&same(p.kg,w.kg)&&rule(w)(p));
    if(p){ p.used=true; w.done=true; w.on=false; }
  }));
}

// ===== 文字の読み取り（iPhoneの「テキスト認識表示」でコピーした文字。外には送らない） =====
async function pasteText(){
  try { const t=await navigator.clipboard.readText(); $('paste').value=t; readText(t); }
  catch { $('status').textContent='自動で貼り付けできませんでした。下の枠を長押しして「ペースト」してください。'; }
}
function readText(t){
  const found=parseText(t||''), st0=parseText.stats||{};
  // 同じ文字を2回読んだときに二重にならないよう、一覧にあるものと1枚ずつ突き合わせる
  const had=work.map(w=>({...w})); let add=0;
  found.forEach(f=>{ const h=had.find(w=>!w.used&&w.dt===f.dt&&same(w.kg,f.kg)); if(h) h.used=true; else { work.push({...f,on:true}); add++; } });
  // 店舗名が文字の中にあれば自動で選ぶ
  const st=db.stores.find(x=>t.includes(x)); if(st) $('store').value=st;
  const n=Math.max(st0.seals||0,st0.dates||0,found.length), miss=n-found.filter(f=>f.kg).length;
  $('status').innerHTML = miss>0
    ? `<b style="color:var(--warn)">⚠ シール${n}枚のうち、${miss}枚の重さが読めていません。</b><br>写真を撮り直して読み直すか、赤い行に重さを入れてください。`
    : `✅ シール${n}枚を見つけ、${n}枚とも重さを読めました（新しく${add}枚を一覧に加えました）。<br>最後に、<b>台紙の一番最後の番号が${n}になっているか</b>と、写真と数字が合っているかを見てください。`;
  $('paste').value=t; markDone(); renderWork();
}
function parseText(t){
  // シール1枚には「鮮魚」「魚のアラ」の行がある。これを目印に1枚ずつ区切る
  // 日時は目印のすぐ上の行、重量は目印より後に出てきた順に、まだ重量のないシールへ入れる
  const s=t.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/(鮮魚|魚のアラ)/g,'\n$1\n').replace(/(20[2-3]\d(?=[^\d\n]+\d))/g,'\n$1');
  const lines=s.split('\n').map(x=>x.trim()).filter(x=>x);
  if(!lines.some(x=>/鮮魚|アラ/.test(x))){ parseText.stats={}; return parseLoose(t); }
  const out=[]; let prevAnchor=false;
  lines.forEach((ln,i)=>{
    if(/鮮魚|アラ/.test(ln)){
      if(!prevAnchor){ const dt=readDate(lines[i-1]||'')||readDate((lines[i-2]||'')+' '+(lines[i-1]||'')); out.push({dt,kg:0}); }
      prevAnchor=true; return;
    }
    prevAnchor=false;
    const re=/(\d{1,3})\s*[.,:;·・]?\s*(\d{2})\s*[kKｋxX]/g; let m;
    if(readDate(ln)) return;
    // 「kg」が読めず「20.96」だけの行も重さとして拾う
    if(!re.test(ln)&&/^\d{1,3}[.,]\d{2}\D{0,2}$/.test(ln)) ln=ln.replace(/\D{0,2}$/,'kg'); re.lastIndex=0;
    while((m=re.exec(ln))){
      const kg=parseFloat(m[1]+'.'+m[2]); if(kg<=0||kg>300) continue;
      const w=out.find(x=>!x.kg); if(w) w.kg=kg; else out.push({dt:'',kg});
    }
  });
  parseText.stats={seals:out.length,dates:lines.filter(x=>readDate(x)).length};
  return out;
}
// 「2026#11:148 16#48»」のように漢字が記号や数字に読み違えられても、日時を取り出す
function readDate(ln){
  const m=ln.match(/^\D{0,3}(20[2-3]\d)\D+(.*)$/); if(!m) return '';
  const parts=m[2].trim().split(/\s+/); if(parts.length<2) return '';
  const tp=parts.pop(), dp=parts.join('');
  const y=+m[1], ref=$ref();
  const ds=pick(dp,1,12,1,31,(a,b)=>{ const d=new Date(y,a-1,b); return d>ref?null:(ref-d); });
  const ts=pick(tp,0,23,0,59,()=>0,true);
  if(!ds||!ts) return '';
  return `${y}-${pad(ds[0])}-${pad(ds[1])}T${pad(ts[0])}:${pad(ts[1])}`;
}
const less=(x,y)=>{ for(let k=0;k<x.length;k++) if(x[k]!==y[k]) return x[k]<y[k]; return false; };
// 数字の並びを「前の数・(余分な1字)・後ろの数・(余分な1字)」に分ける。余分な字は少ないほうを選ぶ
function pick(tok,aMin,aMax,bMin,bMax,dist,b2){
  const d=tok.replace(/\D/g,''), tailOk=/\d$/.test(tok);
  let best=null;
  for(const al of [1,2]) for(const j1 of [0,1]) for(const bl of (b2?[2]:[2,1])) for(const j2 of [0,1]){
    if(al+j1+bl+j2!==d.length||(j2&&!tailOk)) continue;
    const a=+d.slice(0,al), b=+d.slice(al+j1,al+j1+bl);
    if(a<aMin||a>aMax||b<bMin||b>bMax) continue;
    const ds=dist(a,b); if(ds===null) continue;
    const sc=[j1,j1+j2,ds];
    if(!best||less(sc,best.sc)) best={sc,v:[a,b]};
  }
  return best&&best.v;
}
// 目印（鮮魚・魚のアラ）がないときの読み方（版3まで）
function parseLoose(t){
  // 日付が続けて並ぶこともあるので、「待っている日付」の古い順に重量を割り当てる
  // 日付と時刻が別の行に分かれても、年が欠けても読めるように、文字全体を順に探す
  const out=[], wait=[];
  const s=t.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[：]/g,':');
  const re=/(?:(?:20)?(\d{2})\s*[^\d\n月日時分]{1,2}\s*)?(\d{1,2})\s*[^\d]{1,3}?\s*(\d{1,2})\s*[日曰目El]?[^\d]{0,4}?(\d{1,2})\s*[時:hx×Xｘ]\s*(\d{2})\s*分?|(\d{1,3})\s*[.,:;·・]?\s*(\d{2})\s*[kKｋ]/g;
  const nowY=new Date().getFullYear();
  let m;
  while((m=re.exec(s))){
    if(m[6]!==undefined){
      const kg=parseFloat(m[6]+'.'+m[7]); if(kg<=0||kg>300) continue;
      if(wait.length) wait.shift().kg=kg; else out.push({dt:'',kg});
    } else {
      const mo=+m[2], da=+m[3], h=+m[4], mi=+m[5];
      if(mo<1||mo>12||da<1||da>31||h>23||mi>59) continue;
      let y=m[1]?2000+ +m[1]:nowY; if(y<nowY-1||y>nowY+1) y=nowY;
      const x={dt:`${y}-${pad(mo)}-${pad(da)}T${pad(h)}:${pad(mi)}`,kg:0}; out.push(x); wait.push(x);
    }
  }
  return out;
}
const pad=n=>String(n).padStart(2,'0');
// 回収日より後の日付は選ばない
const $ref=()=>{ const v=$('cdate').value; const d=v?new Date(v+'T00:00'):new Date(); d.setDate(d.getDate()+1); return d; };

// ===== 一覧 =====
function renderWork(){
  $('seals').innerHTML = work.length ? work.map((w,i)=>`
    <div class="seal ${w.done?'done':''}">
      <input type="checkbox" ${w.on?'checked':''} onchange="work[${i}].on=this.checked;sum()">
      <input class="dt" type="datetime-local" value="${w.dt}" onchange="work[${i}].dt=this.value;markDone();renderWork()">
      <input class="wt" type="number" step="0.01" inputmode="decimal" value="${w.kg}" onchange="work[${i}].kg=parseFloat(this.value)||0;markDone();renderWork()">
      <button class="small" onclick="work.splice(${i},1);renderWork()">✕</button>
    </div>${w.done?'<div class="tag">前回までに数えたシール</div>':''}${!w.kg?'<div class="tag">重さが読めていません。入力してください</div>':''}${!w.dt?'<div class="muted">日時は読めませんでした（このままでも記録できます）</div>':''}`).join('')
    : '<div class="muted" style="padding:10px 0">まだシールがありません</div>';
  sum();
}
function sum(){ const s=work.filter(w=>w.on); $('sum').textContent=`今回：${s.length}枚　${s.reduce((a,w)=>a+w.kg,0).toFixed(2)}kg`; }
function addManual(){ work.push({dt:'', kg:0, on:true}); renderWork(); }
function clearWork(){ if(!work.length||confirm('入力中のシールを消しますか？')){ work=[]; $('status').textContent=''; renderWork(); } }

function saveCollection(){
  const store=$('store').value; if(!store) return alert('先に設定で店舗を登録してください');
  const seals=work.filter(w=>w.on);
  if(!seals.length) return alert('チェックの付いたシールがありません');
  if(work.some(s=>!s.kg)) return alert('重さが読めていないシールがあります。写真を撮り直すか、重さを入力してください');
  const total=seals.reduce((a,w)=>a+w.kg,0);
  if(!confirm(`${store}　${$('cdate').value}\n${seals.length}枚　${total.toFixed(2)}kg\nこの内容で記録しますか？`)) return;
  db.collections.push({id:Date.now(), store, date:$('cdate').value, seals:seals.map(s=>({dt:s.dt,kg:s.kg}))});
  persist(); work=[]; $('status').textContent='記録しました'; renderWork();
}

// ===== 記録 =====
function renderHistory(){
  const st=$('hstore').value, mo=$('hmonth').value;
  const list=db.collections.filter(c=>(!st||c.store===st)&&(!mo||c.date.startsWith(mo))).sort((a,b)=>b.date.localeCompare(a.date));
  let n=0,kg=0;
  $('hlist').innerHTML = list.map(c=>{
    const t=c.seals.reduce((a,s)=>a+s.kg,0); n+=c.seals.length; kg+=t;
    return `<div class="card"><b>${c.date}</b>　${esc(c.store)}<div class="total">${c.seals.length}枚　${t.toFixed(2)}kg</div>
      <details><summary class="muted">シールの内訳</summary><table>${c.seals.map(s=>`<tr><td>${s.dt?s.dt.replace('T',' '):'日時なし'}</td><td>${s.kg.toFixed(2)}kg</td></tr>`).join('')}</table></details>
      <button class="small" style="margin-top:8px" onclick="delCol(${c.id})">この記録を消す</button></div>`;
  }).join('') || '<div class="card muted">記録はまだありません</div>';
  $('hsum').textContent = `合計：${list.length}回　${n}枚　${kg.toFixed(2)}kg`;
}
function delCol(id){ if(confirm('この回収の記録を消しますか？')){ db.collections=db.collections.filter(c=>c.id!==id); persist(); renderHistory(); } }

// ===== 控え =====
function exportData(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));
  a.download=`重量シール控え_${today()}.json`; a.click();
}
$('imp').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ const d=JSON.parse(await f.text()); if(!d.collections) throw 0;
    if(confirm('今の記録を、この控えの内容に置き換えますか？')){ db=d; persist(); renderStores(); renderHistory(); alert('戻しました'); } }
  catch{ alert('控えのファイルではないようです'); }
  e.target.value='';
};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('cdate').value=today(); $('hmonth').value=today().slice(0,7);
renderStores(); renderWork();
</script>
</body>
</html>
